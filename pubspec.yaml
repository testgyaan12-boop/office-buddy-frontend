name: officebuddy
description: All your office documents in one secure place.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.0
  file_picker: ^10.0.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  flutter_markdown: ^0.7.6
  flutter_pdfview: ^1.3.2
  local_auth: ^2.1.8
  path_provider: ^2.1.1
  url_launcher: ^6.2.0
  archive: ^3.4.10
  open_filex: ^4.4.0
  share_plus: ^12.0.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  pin_code_fields: ^8.0.1
  timeline_tile: ^2.0.0
  flutter_cache_manager: ^3.3.1
  permission_handler: ^11.2.0
  connectivity_plus: ^7.0.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
